name: Deploy Nexora Bank Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXORA_SESSION_SECRET: ${{ secrets.NEXORA_SESSION_SECRET }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXORA_SESSION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "$name GitHub secret is missing."
              exit 1
            fi
          done

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config backend/wrangler.toml

      - name: Configure core Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXORA_SESSION_SECRET: ${{ secrets.NEXORA_SESSION_SECRET }}
        run: |
          printf '%s' "$NEXORA_SESSION_SECRET" | wrangler secret put NEXORA_SESSION_SECRET --config backend/wrangler.toml

      - name: Configure Enable Banking secrets when available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENABLEBANKING_APP_ID: ${{ secrets.ENABLEBANKING_APP_ID }}
          ENABLEBANKING_PRIVATE_KEY: ${{ secrets.ENABLEBANKING_PRIVATE_KEY }}
        run: |
          if [ -n "$ENABLEBANKING_APP_ID" ] && [ -n "$ENABLEBANKING_PRIVATE_KEY" ]; then
            printf '%s' "$ENABLEBANKING_APP_ID" | wrangler secret put ENABLEBANKING_APP_ID --config backend/wrangler.toml
            printf '%s' "$ENABLEBANKING_PRIVATE_KEY" | wrangler secret put ENABLEBANKING_PRIVATE_KEY --config backend/wrangler.toml
            echo "Enable Banking credentials configured."
          else
            echo "Worker deployed without Enable Banking credentials yet."
            echo "Register the callback URL in Enable Banking, then add ENABLEBANKING_APP_ID and ENABLEBANKING_PRIVATE_KEY and re-run this workflow."
          fi

      - name: Configure Firebase push secret when available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --config backend/wrangler.toml
            echo "Firebase push credentials configured."
          else
            echo "Firebase push credentials are not configured yet; bank sync still works without push."
          fi
