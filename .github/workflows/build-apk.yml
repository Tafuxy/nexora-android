name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure bank API
        env:
          NEXORA_BANK_API_URL: ${{ secrets.NEXORA_BANK_API_URL }}
        run: |
          if [ -z "$NEXORA_BANK_API_URL" ]; then
            echo "NEXORA_BANK_API_URL GitHub secret is missing. Deploy the bank backend first."
            exit 1
          fi
          python3 - <<'PY2'
          import os
          from pathlib import Path
          p = Path('app/src/main/assets/www/config.js')
          url = os.environ.get('NEXORA_BANK_API_URL', '').strip().rstrip('/')
          p.write_text(p.read_text().replace('__NEXORA_BANK_API_URL__', url))
          PY2


      - name: Configure Firebase Android app
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "Firebase config is missing."
            echo "Put the Firebase-downloaded google-services.json into app/google-services.json or set FIREBASE_GOOGLE_SERVICES_JSON."
            exit 1
          fi
          python3 -m json.tool app/google-services.json >/dev/null

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Nexora.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-APK
          path: Nexora.apk
