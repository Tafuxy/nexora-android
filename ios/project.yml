name: Nexora
options:
  bundleIdPrefix: com.nexora
  deploymentTarget:
    iOS: "15.0"
targets:
  Nexora:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexora.app
        PRODUCT_NAME: Nexora
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: "11"
        CODE_SIGN_STYLE: Manual
    scheme:
      gatherCoverageData: false
