plugins {
    id 'com.android.application'
}

def googleWebClientId = System.getenv('GOOGLE_WEB_CLIENT_ID') ?: ''
def escapedGoogleClientId = googleWebClientId.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.nexora.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexora.app'
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName '1.2.0'
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"' + escapedGoogleClientId + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/nexora-debug.keystore')
            storePassword 'android'
            keyAlias 'nexora_debug'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    // Kotlin 1.8+ merged jdk7/jdk8 extensions into the main stdlib. Excluding
    // legacy compatibility artifacts prevents duplicate-class failures when
    // Credential Manager and Google identity dependencies resolve together.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
}
