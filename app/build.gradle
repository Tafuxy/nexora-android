plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexora.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexora.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Intentionally no AndroidX/Kotlin runtime dependencies.
// Nexora's interface runs in the built-in Android WebView, so keeping this
// wrapper dependency-free avoids Kotlin stdlib duplicate-class conflicts.
dependencies {
}
