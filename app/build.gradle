plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexora.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexora.app'
        minSdk 28
        targetSdk 35
        versionCode 11
        versionName '1.6.0'
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/nexora-debug.keystore')
            storePassword 'android'
            keyAlias 'nexora_debug'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Nexora's native shell is intentionally framework-light. The UI is bundled
// locally in the WebView and Android's platform biometric APIs handle locking.
dependencies {
}
